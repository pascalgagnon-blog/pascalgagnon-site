services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - wp_db_data:/var/lib/mysql
    networks:
      - internal

  wordpress:
    image: wordpress:latest
    restart: unless-stopped
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_TABLE_PREFIX: wp_
    volumes:
      - wp_data:/var/www/html
    networks:
      - internal
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wp-pascalgagnon.rule=Host(`wp.pascalgagnon.ca`)"
      - "traefik.http.routers.wp-pascalgagnon.entrypoints=websecure"
      - "traefik.http.routers.wp-pascalgagnon.tls=true"
      - "traefik.http.routers.wp-pascalgagnon.tls.certresolver=letsencrypt"
      - "traefik.http.services.wp-pascalgagnon.loadbalancer.server.port=80"
      - "traefik.docker.network=dokploy-network"

volumes:
  wp_data:
  wp_db_data:

networks:
  internal:
    driver: bridge
  dokploy-network:
    external: true
